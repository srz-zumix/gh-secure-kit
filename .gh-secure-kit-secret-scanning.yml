# Local secret scanning configuration for gh-secure-kit itself.
# Used by: gh secure-kit secret-scanning local check / copilot
allowlist:
  regexes:
    # Exact fixture matches also exclude copies recorded in session logs.
    - '^ghp_0123456789abcdefghijABCDEFGHIJ012345$'
    - '^ghp_(a1B2c3){6}$'
    - '^AKIAA{16}$'
    - '^AKIAIVRN52PLDBP55LBQ$'
    - '^AKIA123456789EXAMPLE$'
    - '^AIzaA{35}$'
    - '^xoxb-1234567890-abcdefghij$'
    - '^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U$'
    - '^-----BEGIN RSA PRIVATE KEY-----\n(MIIEow){12}$'
    - '^-----BEGIN RSA PRIVATE KEY-----\nA{64}$'
  paths:
    # Test fixtures contain structurally valid but fake secrets.
    - internal/localscan/*_test.go
